name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua (format check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest", the same way every other repo in the fleet
          # pins it: a stylua release has changed formatting behaviour out
          # from under a repo before, turning the gate red with no local diff
          # to blame. Bump deliberately, with `stylua --write .` run and the
          # diff reviewed.
          version: v2.5.2
          args: --check .

  luacheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # PUC Lua, not "luajit-2.1": that value 404s on this action (LuaJIT
      # stopped publishing the tarball it downloads). Which interpreter runs
      # luacheck is independent of what it checks against -- `std = "luajit"`
      # in .luacheckrc is what pins that.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v6
      - run: luarocks install luacheck 1.2.0
      - run: luacheck lua TESTS

  tests:
    name: testing.nvim specs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        # scripts/test.sh is a bash script besides.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # Both are resolved by scripts/test.sh and TESTS/minimal_init.lua from
      # `.deps/<name>` -- see the four lookup places they document. lib.nvim is
      # a hard runtime dependency (the `:Rules` usercmd goes through
      # usercmd.composer); testing.nvim is the runner for the specs in TESTS/.
      - uses: actions/checkout@v5
        with:
          repository: StefanBartl/lib.nvim
          path: .deps/lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "StefanBartl/testing.nvim"
          path: .deps/testing.nvim
          ref: ci-verified
      - run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        run: bash scripts/test.sh conformance
      # The TypeScript declarations of the machine contract (schemas/rules-export/1/rules-export.d.ts) are generated
      # from the JSON Schema next to them; a schema change without `--write` fails here with the first line that
      # differs. The same check runs as a spec (TESTS/contract_dts_spec.lua); this step names it in the job list.
      # No Node and no lib.nvim: the generator is a Lua script that nvim runs.
      - name: Contract declarations are current
        run: nvim --headless -u NONE -i NONE -n -l scripts/contract-dts.lua --check
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  # documentation.nvim checks this repo out to run the rules engine in its
  # standalone gate. Pointing it at `main` means a broken commit here turns that
  # CI red before anyone traces it back. `ci-verified` only moves once stylua,
  # luacheck and the tests on Linux, Windows and macOS have passed, so a consumer
  # pinning `ref: ci-verified` always tests against a known-good commit. Same job
  # as lib.nvim's (never moves backwards along main, retries a lost lease).
  publish-ci-verified:
    name: publish ci-verified branch
    needs: [stylua, luacheck, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Never move ci-verified backwards along main's history: two pushes can finish
      # out of order, and the older run must not overwrite the newer verified commit.
      # If main's history was rewritten (compare status 'diverged'), ci-verified is
      # deliberately reset to the new verified commit. The
      # lookup fails closed (an API or network error stops the job instead of
      # falling through to a push) and the update carries a lease on the tip it
      # compared against.
      - name: Publish ci-verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        # `bash` (not the default `bash -e`) adds pipefail: a failing `git ls-remote | cut` must stop the job
        # instead of reading as "branch missing".
        shell: bash
        run: |
          # Look the branch up on the remote instead of inferring "missing" from an API
          # error: a failed lookup must stop the job, not fall through to a push.
          # A concurrent run may move ci-verified between the comparison and the push
          # (lease rejected). Re-read the tip and compare again: if the newer run is
          # already ahead of this commit there is nothing left to publish, so that is
          # success, not a failure.
          for attempt in 1 2 3 4; do
            tip=$(git ls-remote --heads origin refs/heads/ci-verified | cut -f1)
            if [ -z "$tip" ]; then
              # First publish. A plain push creates the branch and is rejected if a
              # concurrent run created it first; the next attempt then compares.
              git push origin HEAD:refs/heads/ci-verified && exit 0
              echo "first publish failed on attempt $attempt (another run may have created the branch)"
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
              continue
            fi
            status=$(gh api "repos/$REPO/compare/$tip...$SHA" --jq .status)
            case "$status" in
              behind | identical)
                echo "ci-verified ($tip) is '$status' relative to $SHA (published or superseded); leaving it alone"
                exit 0
                ;;
              ahead | diverged)
                # The lease makes the server refuse the update if ci-verified moved since
                # the comparison, so an older run can never overwrite a newer one.
                git push origin HEAD:refs/heads/ci-verified --force-with-lease="refs/heads/ci-verified:$tip" && exit 0
                echo "push failed on attempt $attempt (lease rejected or another error, see the git output above)"
                [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
                ;;
              *)
                echo "::error::unexpected compare status '$status' for $tip...$SHA"
                exit 1
                ;;
            esac
          done
          echo "::error::could not publish ci-verified after 4 attempts"
          exit 1
